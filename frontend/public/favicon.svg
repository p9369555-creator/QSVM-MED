<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Radiology Background with rounded bevel -->
  <rect width="64" height="64" rx="14" fill="#050607" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#1F242D" stroke-width="2" />
  
  <!-- Outer Amber Quantum Ring -->
  <circle cx="32" cy="32" r="23" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 3" stroke-opacity="0.8" />
  
  <!-- Diagonal Quantum Orbital Ellipses -->
  <ellipse cx="32" cy="32" rx="24" ry="9" transform="rotate(-30 32 32)" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.85" />
  <ellipse cx="32" cy="32" rx="24" ry="9" transform="rotate(30 32 32)" stroke="#F59E0B" stroke-width="1.8" stroke-opacity="0.7" />
  
  <!-- Center Clinical Medical Cross Motif -->
  <rect x="29" y="21" width="6" height="22" rx="2" fill="#F59E0B" />
  <rect x="21" y="29" width="22" height="6" rx="2" fill="#F59E0B" />
  
  <!-- Inner High-Energy Core Nucleus -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  
  <!-- Orbiting Qubit Photons -->
  <circle cx="12" cy="22" r="2.5" fill="#38BDF8" />
  <circle cx="52" cy="42" r="2.5" fill="#38BDF8" />
  <circle cx="48" cy="18" r="2.2" fill="#F59E0B" />
</svg>
